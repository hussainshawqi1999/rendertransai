services:
  - type: web
    name: arabic-subtitles-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start

  - type: web
    name: arabic-subtitles-addon
    runtime: node
    plan: free
    rootDir: addon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BACKEND_URL
        value: https://arabic-subtitles-api.onrender.com
